<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdfb"/>
      <stop offset="0.55" stop-color="#e6ece8"/>
      <stop offset="1" stop-color="#b9c6c2"/>
    </linearGradient>
    <linearGradient id="shellSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3cfcb"/>
      <stop offset="1" stop-color="#93a4a1"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2028"/>
      <stop offset="0.5" stop-color="#123d49"/>
      <stop offset="1" stop-color="#071217"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ff7ee"/>
      <stop offset="1" stop-color="#2fb7a8"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3cb"/>
      <stop offset="1" stop-color="#f0507f"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8cfaf0" stroke-width="1" opacity=".1"/>
    </pattern>
    <pattern id="vent" width="22" height="14" patternUnits="userSpaceOnUse">
      <rect x="2" y="4" width="16" height="5" rx="2.5" fill="#7d8f8c" opacity=".55"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0b2a30" flood-opacity=".22"/>
    </filter>
    <clipPath id="crtClip">
      <rect x="292" y="196" width="636" height="430" rx="46"/>
    </clipPath>
  </defs>

  <!-- 背后的装饰色块，和笔记本那张呼应 -->
  <path d="M232 214 118 160 156 352 244 376Z" fill="url(#teal)" opacity=".55"/>
  <path d="M206 290 92 262 148 430 236 438Z" fill="url(#pink)" opacity=".55"/>
  <path d="M1412 168 1528 120 1494 300 1418 318Z" fill="url(#teal)" opacity=".6"/>
  <path d="M1430 262 1544 232 1500 404 1426 412Z" fill="url(#pink)" opacity=".7"/>

  <!-- 地面阴影 -->
  <ellipse cx="800" cy="812" rx="640" ry="34" fill="#0b2a30" opacity=".12"/>

  <!-- CRT 显示器：厚屁股 -->
  <g filter="url(#shadow)">
    <path d="M330 150 Q300 150 300 182 L320 700 L900 700 L920 182 Q920 150 890 150Z" fill="url(#shellSide)"/>
    <rect x="244" y="132" width="732" height="560" rx="56" fill="url(#shell)" stroke="#8fa19e" stroke-width="5"/>
    <rect x="270" y="158" width="680" height="502" rx="48" fill="#cfd9d5"/>
    <rect x="292" y="196" width="636" height="430" rx="46" fill="url(#screen)"/>
    <g clip-path="url(#crtClip)">
      <rect x="292" y="196" width="636" height="430" fill="url(#grid)"/>
      <path d="M292 560 560 196 700 196 432 626 292 626Z" fill="url(#teal)" opacity=".8"/>
      <path d="M760 626 928 330 928 626Z" fill="url(#pink)" opacity=".85"/>
      <!-- 扫描线 -->
      <g opacity=".14" stroke="#bffff7" stroke-width="2">
        <path d="M292 230H928M292 262H928M292 294H928M292 326H928M292 358H928M292 390H928M292 422H928M292 454H928M292 486H928M292 518H928M292 550H928M292 582H928M292 614H928"/>
      </g>
      <!-- 屏幕上的 32 -->
      <text x="640" y="452" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="156" font-weight="700" fill="#e8fffb">32</text>
      <text x="640" y="508" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="34" fill="#9ff7ee" letter-spacing="10">BIT</text>
      <rect x="762" y="398" width="22" height="54" fill="#9ff7ee"/>
      <path d="M336 248h120M336 272h76" stroke="#d8e9e8" stroke-width="6" stroke-linecap="round" opacity=".5"/>
      <rect x="846" y="232" width="34" height="34" rx="4" fill="#9ff7ee" opacity=".9"/>
      <rect x="292" y="196" width="636" height="430" fill="url(#glass)"/>
    </g>
    <!-- 下巴：品牌条和旋钮 -->
    <rect x="430" y="636" width="200" height="12" rx="6" fill="#9aaba8"/>
    <circle cx="828" cy="642" r="11" fill="#7d8f8c"/>
    <circle cx="866" cy="642" r="11" fill="#7d8f8c"/>
    <circle cx="904" cy="642" r="9" fill="#33e0cf"/>
    <!-- 底座 -->
    <path d="M520 692 L700 692 L736 744 L484 744Z" fill="url(#shellSide)"/>
    <rect x="430" y="736" width="360" height="30" rx="15" fill="url(#shell)" stroke="#8fa19e" stroke-width="4"/>
  </g>

  <!-- 大部头机箱 -->
  <g filter="url(#shadow)">
    <path d="M1300 92 1356 120 1356 774 1300 790Z" fill="url(#shellSide)"/>
    <rect x="1010" y="92" width="300" height="698" rx="22" fill="url(#shell)" stroke="#8fa19e" stroke-width="5"/>
    <!-- 光驱位 5.25 寸 ×2 -->
    <rect x="1040" y="132" width="240" height="56" rx="8" fill="#d6dfdb" stroke="#9aaba8" stroke-width="3"/>
    <rect x="1060" y="156" width="150" height="8" rx="4" fill="#7d8f8c"/>
    <rect x="1236" y="152" width="26" height="14" rx="4" fill="#9aaba8"/>
    <rect x="1040" y="200" width="240" height="56" rx="8" fill="#d6dfdb" stroke="#9aaba8" stroke-width="3"/>
    <rect x="1060" y="224" width="150" height="8" rx="4" fill="#7d8f8c"/>
    <rect x="1236" y="220" width="26" height="14" rx="4" fill="#9aaba8"/>
    <!-- 软驱 3.5 寸 -->
    <rect x="1086" y="278" width="148" height="40" rx="6" fill="#d6dfdb" stroke="#9aaba8" stroke-width="3"/>
    <rect x="1104" y="294" width="96" height="6" rx="3" fill="#33464a"/>
    <rect x="1210" y="292" width="14" height="10" rx="3" fill="#9aaba8"/>
    <!-- 电源键和指示灯 -->
    <circle cx="1160" cy="388" r="34" fill="#e6ece8" stroke="#8fa19e" stroke-width="4"/>
    <path d="M1160 368v18" stroke="#33464a" stroke-width="6" stroke-linecap="round"/>
    <path d="M1146 376a20 20 0 1 0 28 0" fill="none" stroke="#33464a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="1100" cy="446" r="8" fill="#33e0cf"/>
    <circle cx="1220" cy="446" r="8" fill="#f0507f"/>
    <rect x="1140" y="440" width="40" height="12" rx="6" fill="#9aaba8"/>
    <!-- 进气格栅 -->
    <rect x="1048" y="486" width="224" height="250" rx="12" fill="url(#vent)" stroke="#c3cfcb" stroke-width="3"/>
    <!-- 装饰 -->
    <path d="M1040 760h80" stroke="#33e0cf" stroke-width="6" stroke-linecap="round"/>
    <path d="M1236 760h40" stroke="#f0507f" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 键盘 -->
  <g filter="url(#shadow)">
    <path d="M300 790 L930 790 L966 846 L264 846Z" fill="url(#shell)" stroke="#8fa19e" stroke-width="4"/>
    <g fill="#455b5f">
      <rect x="320" y="800" width="560" height="12" rx="4" opacity=".7"/>
      <rect x="310" y="818" width="580" height="12" rx="4" opacity=".7"/>
    </g>
    <rect x="560" y="832" width="140" height="8" rx="4" fill="#33e0cf" opacity=".8"/>
  </g>

  <!-- 漂浮的小方块 -->
  <rect x="1392" y="470" width="22" height="22" transform="rotate(45 1403 481)" fill="#33e0cf"/>
  <path d="M190 560 230 520 230 560Z" fill="#f0507f"/>
</svg>