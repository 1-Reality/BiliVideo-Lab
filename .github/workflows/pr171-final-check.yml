name: PR171 final resolved check
on:
  push:
    branches: [resolve/pr171-final-ci]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: resolve/pr171-ohos
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true
      - name: Apply final OHOS compatibility fixes
        shell: bash
        run: |
          set -eu
          git config user.name "哥哥科技"
          git config user.email "175325443+ucxn@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          p=Path('lib/plugin/pl_player/view/view.dart')
          s=p.read_text()
          bad='''    if (state != AppLifecycleState.paused && state != AppLifecycleState.detached) {\n      plPlayerController.autoResumeInPipIfNeeded();\n    }\n    }\n    if (!plPlayerController.continuePlayInBackground.value) {'''
          good='''    if (state != AppLifecycleState.paused && state != AppLifecycleState.detached) {\n      plPlayerController.autoResumeInPipIfNeeded();\n    }\n    if (!plPlayerController.continuePlayInBackground.value) {'''
          if bad not in s: raise SystemExit('lifecycle brace pattern not found')
          p.write_text(s.replace(bad,good,1))

          p=Path('lib/plugin/pl_player/controller.dart')
          s=p.read_text()
          call='''        pgcType: pgcType,\n        videoType: videoType,'''
          if call not in s: raise SystemExit('liveUid wrapper call anchor not found')
          s=s.replace(call,'''        pgcType: pgcType,\n        liveUid: liveUid,\n        videoType: videoType,''',1)
          sig='''    int? seasonId,\n    int? pgcType,\n    VideoType? videoType,'''
          if sig not in s: raise SystemExit('liveUid private signature anchor not found')
          s=s.replace(sig,'''    int? seasonId,\n    int? pgcType,\n    int? liveUid,\n    VideoType? videoType,''',1)
          p.write_text(s)

          Path('lib/utils/windows/network_info.dart').write_text('''final class WindowsNetworkInfo {\n  const WindowsNetworkInfo({this.rssi, this.wifiMbps, this.wiredMbps});\n\n  final int? rssi;\n  final int? wifiMbps;\n  final int? wiredMbps;\n}\n\nabstract final class WindowsNetworkInfoReader {\n  static const _empty = WindowsNetworkInfo();\n\n  static WindowsNetworkInfo read() => _empty;\n}\n''')
          PY
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' lib android
          git diff --check
      - name: Get Flutter dependencies
        run: flutter pub get
        env:
          GIT_LFS_SKIP_SMUDGE: 1
      - name: Dart Analyze
        run: dart analyze --no-fatal-warnings
      - name: Publish final resolved branch
        shell: bash
        run: |
          git add lib/plugin/pl_player/view/view.dart lib/plugin/pl_player/controller.dart lib/utils/windows/network_info.dart
          git commit -m "fix: adapt playback insights to OHOS runtime"
          git push origin HEAD:refs/heads/resolve/pr171-final --force
