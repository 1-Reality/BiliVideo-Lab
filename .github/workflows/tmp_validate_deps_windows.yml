name: Temporary Windows dependency validation

on:
  push:
    branches:
      - tmp/validate-deps-windows-20260910

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/validate-deps-windows-20260910
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Run project Windows patch/dependency stage
        shell: pwsh
        run: lib/scripts/patch.ps1 windows
