name: Validate Mainback

on:
  push:
    branches:
      - mainback
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Flutter static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply project Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  windows-compile:
    name: Windows compile validation
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Use Git OpenSSL TLS backend
        shell: pwsh
        run: git config --global http.sslBackend openssl

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      - name: Apply media_kit decoder lab patch
        shell: pwsh
        run: lib/scripts/patch_media_kit_decoder_lab.ps1

      - name: Build Windows
        shell: pwsh
        run: flutter build windows --release --dart-define-from-file=pili_release.json --no-pub
