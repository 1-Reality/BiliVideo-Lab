name: Validate Mainback

on:
  push:
    branches:
      - mainback
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Flutter static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply project Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
