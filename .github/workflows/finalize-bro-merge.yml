name: Finalize Bro Merge

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: finalize-bro-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge reviewed Bro into lab4AI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lab4AI
        uses: actions/checkout@v7
        with:
          ref: lab4AI
          fetch-depth: 0

      - name: Fetch Bro and mainback
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin             +refs/heads/bro:refs/remotes/origin/bro             +refs/heads/mainback:refs/remotes/origin/mainback

      - name: Validate Bro PR
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          LAB_SHA="$(git rev-parse HEAD)"
          BRO_SHA="$(git rev-parse origin/bro)"
          MAINBACK_SHA="$(git rev-parse origin/mainback)"

          echo "lab_sha=$LAB_SHA" >> "$GITHUB_OUTPUT"
          echo "bro_sha=$BRO_SHA" >> "$GITHUB_OUTPUT"
          echo "mainback_sha=$MAINBACK_SHA" >> "$GITHUB_OUTPUT"

          if ! git merge-base --is-ancestor origin/mainback origin/bro; then
            echo "::error::Bro does not contain current mainback. Run Prepare Bro Sync again."
            exit 1
          fi

          if git merge-base --is-ancestor origin/bro HEAD; then
            echo "already_merged=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Bro is already contained in lab4AI."
            exit 0
          fi

          echo "already_merged=false" >> "$GITHUB_OUTPUT"

          mapfile -t PRS < <(
            gh pr list               --repo "$GITHUB_REPOSITORY"               --state open               --base lab4AI               --head bro               --json number,url,headRefOid               --jq '.[] | [.number, .url, .headRefOid] | @tsv'
          )

          if [[ "${#PRS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one open bro -> lab4AI PR, found ${#PRS[@]}."
            exit 1
          fi

          IFS=$'\t' read -r PR_NUMBER PR_URL PR_HEAD_SHA <<< "${PRS[0]}"

          if [[ "$PR_HEAD_SHA" != "$BRO_SHA" ]]; then
            echo "::error::Open PR head ($PR_HEAD_SHA) does not match current Bro ($BRO_SHA)."
            exit 1
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Merge Bro and preserve product-owned files
        id: merge
        if: steps.validate.outputs.already_merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BEFORE="$(git rev-parse HEAD)"

          set +e
          git merge --no-ff --no-commit origin/bro
          MERGE_RC=$?
          set -e

          # README, LICENSE and .github belong to lab4AI. Restore that subtree exactly,
          # including deleting files that exist only on Bro.
          rm -rf README.md LICENSE .github
          git rm -r --cached --ignore-unmatch README.md LICENSE .github >/dev/null 2>&1 || true
          git archive "$BEFORE" README.md LICENSE .github | tar -x
          git add -A README.md LICENSE .github

          echo "===== merge command exit code ====="
          echo "$MERGE_RC"
          echo
          echo "===== unresolved files after auto-resolving protected files ====="
          REMAINING_CONFLICTS="$(git diff --name-only --diff-filter=U || true)"
          printf '%s\n' "$REMAINING_CONFLICTS"

          if [[ -n "$REMAINING_CONFLICTS" ]]; then
            {
              echo "## Merge stopped on real conflicts"
              echo
              echo "Protected files were resolved automatically, but real code conflicts remain."
              echo "No commit was pushed."
              echo
              echo "Unresolved files:"
              echo '~~~'
              printf '%s\n' "$REMAINING_CONFLICTS"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort || true
            exit 1
          fi

          if ! git diff --cached --quiet "$BEFORE" -- README.md LICENSE .github; then
            echo "::error::Protected files still differ after exact restoration."
            git diff --cached --name-status "$BEFORE" -- README.md LICENSE .github || true
            git merge --abort || true
            exit 1
          fi

          git commit             -m "Merge PR #${{ steps.validate.outputs.pr_number }}: Bro sync into lab4AI"             -m "Bro-SHA: ${{ steps.validate.outputs.bro_sha }}"             -m "Mainback-SHA: ${{ steps.validate.outputs.mainback_sha }}"

          MERGE_SHA="$(git rev-parse HEAD)"
          PARENTS="$(git show -s --format='%P' HEAD)"

          if [[ "$(wc -w <<< "$PARENTS")" -ne 2 ]]; then
            echo "::error::Expected a two-parent merge commit."
            exit 1
          fi

          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

          echo "===== merge commit ====="
          git show -s --format='%H%n%P%n%s' HEAD
          echo
          echo "===== protected-file diff against first parent ====="
          git diff --name-status "$BEFORE" HEAD -- README.md LICENSE .github

      - name: Push lab4AI
        if: steps.validate.outputs.already_merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:lab4AI
          {
            echo "## Bro merge finalized"
            echo
            echo "- PR: #${{ steps.validate.outputs.pr_number }}  ${{ steps.validate.outputs.pr_url }}"
            echo "- merge commit: ${{ steps.merge.outputs.merge_sha }}"
            echo "- README / LICENSE / .github: preserved exactly from pre-merge lab4AI"
            echo "- Bro -> mainback -> upstream ancestry: preserved"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report no-op
        if: steps.validate.outputs.already_merged == 'true'
        shell: bash
        run: |
          {
            echo "## Nothing to do"
            echo
            echo "Current Bro is already an ancestor of lab4AI."
          } >> "$GITHUB_STEP_SUMMARY"
