name: Build

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review
        branches:
            - dev
            - lab4AI
        paths-ignore:
            - "**.md"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean

            build_ios:
                description: "Build iOS"
                required: false
                default: false
                type: boolean

            build_mac:
                description: "Build Mac"
                required: false
                default: false
                type: boolean

            build_win_x64:
                description: "Build Win-x64"
                required: false
                default: true
                type: boolean

            build_linux_x64:
                description: "Build Linux-x64"
                required: false
                default: false
                type: boolean

            tag:
                description: "tag"
                required: false
                default: ""
                type: string

            build_number:
                description: "Build number (0 = auto)"
                required: false
                default: "0"
                type: string

            release_notes:
                description: "Release notes"
                required: false
                default: ""
                type: string

jobs:
    android:
        if: ${{ (github.event_name == 'pull_request' && github.repository == '1-Reality/BiliVideo-Lab' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false && (github.base_ref == 'lab4AI' || (github.base_ref == 'dev' && github.head_ref == 'lab4AI'))) || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_android == 'true') }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Apply media_kit Android decoder lab hook
              shell: pwsh
              run: lib/scripts/patch_media_kit_android_decoder_lab.ps1

            - name: Write fixed Android signing key
              env:
                  SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: |
                  test -n "$SIGN_KEYSTORE_BASE64" || { echo "Missing SIGN_KEYSTORE_BASE64"; exit 1; }
                  test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
                  test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }
                  test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }
                  echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
                  {
                    echo storeFile='key.jks'
                    echo storePassword="$KEYSTORE_PASSWORD"
                    echo keyAlias="$KEY_ALIAS"
                    echo keyPassword="$KEY_PASSWORD"
                  } > android/key.properties

            - name: Set and Extract version
              shell: pwsh
              env:
                  BUILD_NUMBER_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_number || '' }}
                  RELEASE_TAG_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
              run: lib/scripts/build.ps1 android

            - name: Flutter Build Release Apk
              if: ${{ github.event_name == 'workflow_dispatch' }}
              run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub

            - name: Flutter Build Dev Apk
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  flutter build apk --release --split-per-abi --android-project-arg dev=1 --dart-define-from-file=pili_release.json --no-pub

            - name: Rename
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "PiliBro_android_${{ env.version }}_${abi}.apk"
                  done
              shell: bash

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_arm64-v8a
                  path: PiliBro_android_*_arm64-v8a.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_armeabi-v7a
                  path: PiliBro_android_*_armeabi-v7a.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_x86_64
                  path: PiliBro_android_*_x86_64.apk

    ios:
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_ios == 'true' }}
        uses: ./.github/workflows/ios.yml
        permissions:
            contents: read
        with:
            tag: ${{ github.event.inputs.tag }}
            build_number: ${{ github.event.inputs.build_number }}

    mac:
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_mac == 'true' }}
        uses: ./.github/workflows/mac.yml
        permissions:
            contents: read
        with:
            tag: ${{ github.event.inputs.tag }}
            build_number: ${{ github.event.inputs.build_number }}

    win_x64:
        if: ${{ (github.event_name == 'pull_request' && github.repository == '1-Reality/BiliVideo-Lab' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false && (github.base_ref == 'lab4AI' || (github.base_ref == 'dev' && github.head_ref == 'lab4AI'))) || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_win_x64 == 'true') }}
        uses: ./.github/workflows/win_x64.yml
        permissions:
            contents: read
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
            build_number: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_number || '0' }}
            include_portable: ${{ github.event_name == 'workflow_dispatch' }}

    linux_x64:
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_linux_x64 == 'true' }}
        uses: ./.github/workflows/linux_x64.yml
        permissions:
            contents: read
        with:
            tag: ${{ github.event.inputs.tag }}
            build_number: ${{ github.event.inputs.build_number }}

    publish:
        name: Publish Release
        needs: [android, win_x64, ios, mac, linux_x64]
        if: >-
            ${{
                always() &&
                github.event_name == 'workflow_dispatch' &&
                github.event.inputs.tag != '' &&
                needs.android.result == 'success' &&
                needs.win_x64.result == 'success' &&
                (needs.ios.result == 'success' || needs.ios.result == 'skipped') &&
                (needs.mac.result == 'success' || needs.mac.result == 'skipped') &&
                (needs.linux_x64.result == 'success' || needs.linux_x64.result == 'skipped')
            }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@v7
              with:
                  path: release-assets
                  merge-multiple: true

            - name: Publish Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  body: ${{ github.event.inputs.release_notes }}
                  files: release-assets/**/*
