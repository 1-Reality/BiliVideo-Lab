name: Android JIT (debug)

# 好奇用：安卓的 JIT 版就是 debug 包。和正式包同一个签名，可以直接覆盖安装、保留数据
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Apply media_kit Android decoder lab hook
        shell: pwsh
        run: lib/scripts/patch_media_kit_android_decoder_lab.ps1

      - name: Write signing key
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          {
            echo storeFile='key.jks'
            echo storePassword="$KEYSTORE_PASSWORD"
            echo keyAlias="$KEY_ALIAS"
            echo keyPassword="$KEY_PASSWORD"
          } > android/key.properties

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Build debug (JIT) apk
        run: |
          flutter build apk --debug --target-platform android-arm64 --dart-define-from-file=pili_release.json --no-pub
          mv build/app/outputs/flutter-apk/app-debug.apk "PiliBro_android_${{ env.artifact_version }}_arm64-v8a_jit.apk"

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Android_arm64-v8a_jit
          path: PiliBro_android_*_jit.apk