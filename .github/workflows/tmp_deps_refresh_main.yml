name: Temporary main dependency refresh

on:
  push:
    branches:
      - tmp/deps-refresh-main-20260910

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/deps-refresh-main-20260910
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Apply upstream routine dependency refresh
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          s = p.read_text()
          s = s.replace('  flutter: 3.47.1', '  flutter: 3.47.3', 1)
          old = '''  flex_seed_scheme:\n    git:\n      url: https://github.com/bggRGjQaUbCoE/flex_seed_scheme.git\n      ref: dev'''
          if old not in s:
              raise SystemExit('old flex_seed_scheme block not found')
          s = s.replace(old, '  flex_seed_scheme: ^5.0.0', 1)
          s = s.replace('  jnigen: ^0.17.0', '  jnigen: ^1.0.0', 1)
          p.write_text(s)

          f = Path('.fvmrc')
          f.write_text(f.read_text().replace('3.47.1', '3.47.3'))
          PY

          curl -fsSL \
            https://raw.githubusercontent.com/bggRGjQaUbCoE/PiliPlus/main/lib/scripts/material/scaffold.patch \
            -o lib/scripts/material/scaffold.patch

          flutter pub upgrade

      - name: Sanity check material patch
        shell: bash
        run: |
          set -e
          MATERIAL_UI_DIR=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -type d -name 'material_ui-*' | sort | tail -n 1)
          test -n "$MATERIAL_UI_DIR"
          cd "$MATERIAL_UI_DIR"
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm baseline
          git apply --check "$GITHUB_WORKSPACE/lib/scripts/material/scaffold.patch"

      - name: Commit refreshed files
        shell: bash
        run: |
          git rm .github/workflows/tmp_deps_refresh_main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .fvmrc pubspec.yaml pubspec.lock lib/scripts/material/scaffold.patch
          git diff --cached --check
          git commit -m '更新 Flutter 与例行依赖'
          git push origin HEAD:tmp/deps-refresh-main-20260910
