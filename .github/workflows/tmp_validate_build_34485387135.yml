name: Temporary validate build 34485387135

on:
  push:
    branches:
      - tmp/fix-build-34485387135

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Apply Android patches and resolve dependencies
        shell: pwsh
        run: lib/scripts/patch.ps1 android
      - name: Apply media_kit Android decoder lab hook
        shell: pwsh
        run: lib/scripts/patch_media_kit_android_decoder_lab.ps1
      - name: Compile Android debug
        run: flutter build apk --debug --target-platform android-arm64 --no-pub
      - name: Commit resolved lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m "刷新 flutter_html 依赖锁定"
            git push origin HEAD:tmp/fix-build-34485387135
          fi

  ios:
    runs-on: macos-26-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: ARM64
          cache: false
      - name: Apply iOS patches
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS
      - name: Compile iOS without signing
        run: flutter build ios --release --no-codesign --no-pub
