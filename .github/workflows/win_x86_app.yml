name: Windows x86 app (PiliBro portable, staged)

# 第二阶段：用 32 位引擎打出能运行的便携包。引擎与 ANGLE 直接从 Release 下载，不在这里重编。
# 按块推进：每个块验证通过后再接下一块。
on:
  workflow_dispatch:
  # 本文件还没在默认分支上，workflow_dispatch 只能在默认分支的工作流上用；先靠推送本分支触发
  push:
    branches: [fix/experimental-x86-git-am-identity]
    paths: [.github/workflows/win_x86_app.yml, lib/scripts/**]

permissions:
  contents: read

jobs:
  kernel:
    # 块 1：kernel_blob.bin。kernel 与 CPU 位数无关，在 x64 机器上用 product 平台 dill 编。
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: setup
        name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - id: version
        name: Set version and write pili_release.json
        shell: pwsh
        run: lib/scripts/build.ps1

      - id: patch
        name: Apply project Windows patches
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      - id: precache
        name: Precache Windows engine artifacts (including product platform dill)
        shell: pwsh
        run: flutter precache --windows

      - id: debug
        name: Official x64 debug build (sanity check of the same toolchain; not used for the kernel)
        shell: pwsh
        run: flutter build windows --debug -v 2>&1 | Tee-Object flutter-debug-build.log

      - id: kernel
        name: Build product kernel_blob.bin with the official KernelSnapshot arguments
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandArgumentPassing = 'Standard'
          # 出错时把异常写进工件，诊断步骤会读它（日志下载不可用）
          trap { "$($_.Exception.Message) @ line $($_.InvocationInfo.ScriptLineNumber): $($_.InvocationInfo.Line.Trim())" | Out-File kernel-error.txt -Encoding UTF8; break }

          # 参数来源（flutter_tools 3.47.5）：
          #   targets/common.dart  KernelSnapshot.build：aot=false，release 下 trackWidgetCreation=false，windows_x64 强制 link platform
          #   compile.dart         buildModeOptions(release)、kDartCompilerExperiments（空）、参数拼装顺序
          $flutterRoot = Split-Path (Split-Path (Get-Command flutter).Source -Parent) -Parent
          $engine = Join-Path $flutterRoot 'bin\cache\artifacts\engine'
          $flutterRoot | Out-File flutter-root.txt -Encoding UTF8
          Get-ChildItem $engine -Recurse -File -Include 'dartaotruntime.exe','frontend_server_aot.dart.snapshot','*.dill' -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.FullName)  $($_.Length)" } | Out-File engine-artifacts.txt -Encoding UTF8
          # engineDartAotRuntime 在宿主上是 cache/dart-sdk/bin/dartaotruntime.exe（artifacts.dart:716）
          $dartaot = Join-Path $flutterRoot 'bin\cache\dart-sdk\bin\dartaotruntime.exe'
          $frontend = (Get-ChildItem $engine -Recurse -Filter 'frontend_server_aot.dart.snapshot' | Select-Object -First 1).FullName
          $sdk = Get-ChildItem $engine -Recurse -Directory -Filter 'flutter_patched_sdk_product' | Select-Object -First 1
          if (-not (Test-Path $dartaot)) { throw "dartaotruntime.exe not found at $dartaot" }
          if (-not $frontend) { throw 'frontend_server_aot.dart.snapshot not found under the engine cache' }
          if (-not $sdk) { throw 'flutter_patched_sdk_product not found under the engine cache' }
          Write-Host "dartaotruntime: $dartaot"
          Write-Host "frontend_server: $frontend"
          Write-Host "sdk-root: $($sdk.FullName)"
          Write-Host "platform_strong.dill present: $(Test-Path (Join-Path $sdk.FullName 'platform_strong.dill'))"

          $pkgs = Join-Path $env:GITHUB_WORKSPACE '.dart_tool\package_config.json'
          $main = Join-Path $env:GITHUB_WORKSPACE 'lib\main.dart'
          if (-not (Test-Path $pkgs)) { throw "missing $pkgs (pub get did not run?)" }
          if (-not (Test-Path $main)) { throw "missing $main" }

          $kernelDir = Join-Path $env:GITHUB_WORKSPACE 'kernel'
          New-Item -ItemType Directory -Force $kernelDir | Out-Null
          $dill = Join-Path $kernelDir 'app.dill'

          # 等价于 --dart-define-from-file=pili_release.json：每个键转成 -Dkey=value
          $defs = Get-Content pili_release.json -Raw | ConvertFrom-Json
          $defArgs = @($defs.PSObject.Properties | ForEach-Object { "-D$($_.Name)=$($_.Value)" })

          $frontendArgs = @(
            $frontend,
            '--sdk-root', $sdk.FullName,
            '--target=flutter',
            '--no-print-incremental-dependencies'
          ) + $defArgs + @(
            '-Ddart.vm.profile=false',
            '-Ddart.vm.product=true',
            '--delete-tostring-package-uri=dart:ui',
            '--delete-tostring-package-uri=package:flutter',
            '--packages', $pkgs,
            '--output-dill', $dill,
            '--verbosity=error',
            $main
          )

          # 日志里只写参数形状，不写 define 的值
          $shape = $frontendArgs | ForEach-Object { if ($_ -like '-D*=*') { ($_ -split '=')[0] + '=<value>' } else { $_ } }
          "dartaotruntime: $dartaot" | Tee-Object kernel-command.txt
          ($shape -join ' ') | Tee-Object -Append kernel-command.txt

          & $dartaot @frontendArgs 2>&1 | Tee-Object kernel-build.log
          if ($LASTEXITCODE -ne 0) { throw "product kernel compile failed (exit $LASTEXITCODE)" }

          Copy-Item $dill (Join-Path $kernelDir 'kernel_blob.bin')
          Get-Item (Join-Path $kernelDir 'kernel_blob.bin') | Format-Table Name, Length

      - id: engine86
        name: Fetch the 32-bit engine from our release and check its PE machine
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Select-String -Path pubspec.yaml -Pattern '^\s*flutter:\s*([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1).Matches.Groups[1].Value
          $tag = "engine-win-x86-jit-$ver"
          New-Item -ItemType Directory -Force engine86-dl | Out-Null
          gh release download $tag -R $env:GITHUB_REPOSITORY -p "$tag.7z" -D engine86-dl
          7z x -y -oengine86 "engine86-dl\$tag.7z" flutter_windows.dll flutter_windows.dll.lib icudtl.dat | Out-Null
          foreach ($f in 'flutter_windows.dll','flutter_windows.dll.lib','icudtl.dat') {
            if (-not (Test-Path "engine86\$f")) { throw "missing $f in $tag" }
          }
          $b = [IO.File]::ReadAllBytes("$PWD\engine86\flutter_windows.dll")
          $machine = '{0:X4}' -f [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 4)
          "flutter_windows.dll machine=$machine (expect 014C)" | Tee-Object engine86-check.txt
          if ($machine -ne '014C') { throw "engine dll is not x86: $machine" }

      - id: engineswap
        name: Put the x86 engine into the x64 engine cache copies (CI-only; flutter_assemble copies from there)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $flutterRoot = Split-Path (Split-Path (Get-Command flutter).Source -Parent) -Parent
          # artifacts.dart:797-802：debug 用 windows-x64，其余模式用 windows-x64-<mode>。
          # 上一轮证明 cmake --config Release 时 flutter_assemble 拷的是 windows-x64-release，所以所有 windows-x64* 都要换
          $dirs = Get-ChildItem (Join-Path $flutterRoot 'bin\cache\artifacts\engine') -Directory -Filter 'windows-x64*'
          if (-not $dirs) { throw 'no windows-x64* engine directories in the cache' }
          foreach ($d in $dirs) {
            foreach ($f in 'flutter_windows.dll','flutter_windows.dll.lib','icudtl.dat') {
              if (Test-Path (Join-Path $d.FullName $f)) { Copy-Item "engine86\$f" (Join-Path $d.FullName $f) -Force }
            }
            "swapped $($d.FullName)" | Out-Host
          }
          # 不改仓库里的 CMake：tool_backend 拷进去的就是这些 x86 文件

      - id: patch32
        name: Apply x86-only plugin patches (CI working copies only; not committed)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lib/scripts/patch_x86_plugins.ps1
          lib/scripts/patch_media_kit_libmpv_x86.ps1

      - id: exe32
        name: Configure and build the runner as Win32, then stage with cmake --install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap { "$($_.Exception.Message) @ line $($_.InvocationInfo.ScriptLineNumber): $($_.InvocationInfo.Line.Trim())" | Out-File exe32-error.txt -Encoding UTF8; break }
          if (-not (Test-Path 'windows\flutter\ephemeral')) { throw 'ephemeral directory missing (debug build did not run)' }
          # ephemeral 里的 flutter_windows.dll.lib 是 x64 调试构建拷进去的；plugin 链接用的就是它，必须换成 x86
          # （上一轮 LNK4272 x64 冲突 + 大量 LNK2019 都由此而来）
          function Show($label) {
            $cacheDir = Join-Path (Split-Path (Split-Path (Get-Command flutter).Source -Parent) -Parent) 'bin\cache\artifacts\engine\windows-x64'
            foreach ($p in @((Join-Path $cacheDir 'flutter_windows.dll'), 'windows\flutter\ephemeral\flutter_windows.dll', 'windows\flutter\ephemeral\flutter_windows.dll.lib', 'engine86\flutter_windows.dll', 'engine86\flutter_windows.dll.lib')) {
              if (Test-Path $p) {
                $h = (Get-FileHash $p -Algorithm SHA256).Hash.Substring(0,12)
                $b = [IO.File]::ReadAllBytes((Resolve-Path $p).Path)
                $m = if ($p -like '*.dll') { '{0:X4}' -f [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 4) } else { '-' }
                "[$label] $p sha=$h machine=$m"
              } else { "[$label] $p MISSING" }
            }
          }
          foreach ($f in 'flutter_windows.dll','flutter_windows.dll.lib','icudtl.dat') {
            Copy-Item "engine86\$f" "windows\flutter\ephemeral\$f" -Force
          }
          Show 'before-configure' | Tee-Object exe32.log
          Get-ChildItem 'windows\flutter\ephemeral' -Filter 'flutter_windows.dll*' | Format-Table Name, Length
          cmake -S windows -B build32 -A Win32 2>&1 | Tee-Object -Append exe32.log
          Show 'after-configure' | Tee-Object -Append exe32.log
          if ($LASTEXITCODE -ne 0) { throw 'cmake configure failed' }
          cmake --build build32 --config Release 2>&1 | Tee-Object -Append exe32.log
          Show 'after-build' | Tee-Object -Append exe32.log
          if ($LASTEXITCODE -ne 0) { throw 'cmake build failed' }
          # flutter 的 CMake 把安装前缀定死在 build32\runner\Release（见 exe32.log 的 Installing 行），--prefix 不生效
          cmake --install build32 --config Release 2>&1 | Tee-Object -Append exe32.log
          if ($LASTEXITCODE -ne 0) { throw 'cmake install failed' }
          $stage = 'build32\runner\Release'
          if (-not (Test-Path (Join-Path $stage 'pilibro.exe'))) { throw "install output not found at $stage" }
          # release 配置下 flutter_assemble 生成了 AOT 的 app.so；jit_release 引擎只用 kernel_blob.bin，删掉避免按 AOT 加载
          Remove-Item (Join-Path $stage 'data\app.so') -ErrorAction SilentlyContinue
          # 第 1 块的产品版 kernel 放进 flutter_assets（jit_release 运行时读 kernel_blob.bin）
          Copy-Item kernel\kernel_blob.bin (Join-Path $stage 'data\flutter_assets\kernel_blob.bin') -Force
          $exe = Get-Item (Join-Path $stage 'pilibro.exe')
          $b = [IO.File]::ReadAllBytes($exe.FullName)
          $machine = '{0:X4}' -f [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 4)
          "$($exe.Name) machine=$machine (expect 014C)"
          if ($machine -ne '014C') { throw "exe is not x86: $machine" }
          Get-ChildItem $stage -Recurse -File | Format-Table FullName, Length

      - id: check32
        name: Check every DLL and the exe in the staged folder is x86 (0x14c)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'build32\runner\Release'
          $bad = New-Object System.Collections.Generic.List[string]
          $root = (Resolve-Path $stage).Path
          $lines = New-Object System.Collections.Generic.List[string]
          foreach ($f in Get-ChildItem $stage -Recurse -File -Include *.dll,*.exe) {
            $b = [IO.File]::ReadAllBytes($f.FullName)
            $m = '{0:X4}' -f [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 4)
            $lines.Add("$m  $($f.FullName.Substring($root.Length + 1))")
            if ($m -ne '014C') { $bad.Add("$($f.Name)=$m") }
          }
          $lines | Set-Content architecture.txt
          $lines | ForEach-Object { Write-Host $_ }
          if ($bad.Count -gt 0) { throw "non-x86 binaries in the stage: $($bad -join ', ')" }

      - id: smoke
        name: "Smoke test: launch pilibro.exe, wait 15 s, check it is alive, take a screenshot"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'build32\runner\Release'
          $exe = (Resolve-Path (Join-Path $stage 'pilibro.exe')).Path
          $start = Get-Date
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 15
          $p.Refresh()
          $alive = -not $p.HasExited
          $title = $p.MainWindowTitle
          $hwnd = $p.MainWindowHandle
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save((Join-Path $PWD 'smoke.png'), [Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          "alive=$alive title='$title' hwnd=$hwnd exitCode=$(if ($alive) { 'running' } else { $p.ExitCode })" | Tee-Object smoke.txt
          $events = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $start } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'pilibro|flutter_windows|media_kit|libmpv' } | Select-Object -First 5
          $events | ForEach-Object { "event $($_.Id) $($_.LevelDisplayName): $($_.Message.Substring(0,[Math]::Min(300,$_.Message.Length)))" } | Tee-Object -Append smoke.txt
          if ($alive) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (-not $alive) { throw "pilibro.exe exited within 15 s (exit $($p.ExitCode))" }
          if (-not $hwnd -or $hwnd -eq 0) { throw 'pilibro.exe is alive but has no main window' }

      - id: pack
        name: Pack the portable 7z (not published; artifact only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Select-String -Path pubspec.yaml -Pattern '^\s*version:\s*([0-9.]+)' | Select-Object -First 1).Matches.Groups[1].Value
          $dir = 'PiliBro-Win-x86'
          Copy-Item build32\runner\Release $dir -Recurse
          7z a -mx9 'PiliBro_windows_x86_portable.7z' $dir | Out-Null
          Get-Item 'PiliBro_windows_x86_portable.7z' | Format-Table Name, Length

      - name: Upload portable 7z, screenshot and smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-x86-portable-block4
          path: |
            PiliBro_windows_x86_portable.7z
            smoke.png
            smoke.txt
            architecture.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload 32-bit stage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-x86-stage-block2
          path: build32/runner/Release
          if-no-files-found: warn
          retention-days: 14

      - name: Diagnostics on failure (annotations; artifact downloads are blocked in some sessions)
        if: failure()
        shell: pwsh
        env:
          O_SETUP: ${{ steps.setup.outcome }}
          O_VERSION: ${{ steps.version.outcome }}
          O_PATCH: ${{ steps.patch.outcome }}
          O_PRECACHE: ${{ steps.precache.outcome }}
          O_DEBUG: ${{ steps.debug.outcome }}
          O_KERNEL: ${{ steps.kernel.outcome }}
          O_ENGINE86: ${{ steps.engine86.outcome }}
          O_SWAP: ${{ steps.engineswap.outcome }}
          O_EXE32: ${{ steps.exe32.outcome }}
          O_PATCH32: ${{ steps.patch32.outcome }}
          O_CHECK32: ${{ steps.check32.outcome }}
          O_SMOKE: ${{ steps.smoke.outcome }}
          O_PACK: ${{ steps.pack.outcome }}
        run: |
          function Emit($title, $lines) {
            $text = ($lines -join "`n")
            if ($text.Length -gt 3500) { $text = $text.Substring($text.Length - 3500) }
            $enc = ($text -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
            Write-Host "::error title=$title::$enc"
          }
          Emit 'step outcomes' @(
            "setup=$env:O_SETUP version=$env:O_VERSION patch=$env:O_PATCH precache=$env:O_PRECACHE debug=$env:O_DEBUG kernel=$env:O_KERNEL engine86=$env:O_ENGINE86 swap=$env:O_SWAP patch32=$env:O_PATCH32 exe32=$env:O_EXE32 check32=$env:O_CHECK32 smoke=$env:O_SMOKE pack=$env:O_PACK"
          )
          if (Test-Path 'exe32.log') { Emit 'exe32 errors (compiler/linker)' @(Get-Content exe32.log | Where-Object { $_ -match ' error [A-Z]+\d+|fatal error|LNK\d{4}|C2220' } | Select-Object -First 40) }
          if (Test-Path 'exe32.log') { Emit 'exe32 probes' @(Get-Content exe32.log | Where-Object { $_ -match '^\[(before|after)' }) }
          foreach ($f in 'exe32-error.txt','exe32.log','kernel-error.txt','engine-artifacts.txt','flutter-root.txt','flutter-debug-build.log','kernel-build.log','kernel-command.txt') {
            if (Test-Path $f) {
              $all = Get-Content $f
              $hits = $all | Where-Object { $_ -match 'error|Error|ERROR|Exception|FAILED|failed' } | Select-Object -First 25
              Emit "$f errors" @($hits)
              Emit "$f tail" @($all | Select-Object -Last 40)
            } else { Emit "$f" @("(missing)") }
          }

      - name: Upload kernel and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-kernel-block1
          path: |
            kernel/kernel_blob.bin
            kernel/app.dill
            kernel-command.txt
            kernel-build.log
            kernel-error.txt
            exe32-error.txt
            exe32.log
            engine-artifacts.txt
            flutter-root.txt
            flutter-debug-build.log
          if-no-files-found: warn
          retention-days: 14
