name: Decoder Lab Experimental Build

on:
  push:
    branches:
      - feat/decoder-lab-glue

jobs:
  windows:
    name: Windows decoder lab
    uses: ./.github/workflows/win_x64.yml
    permissions: write-all
    with:
      tag: ""

  android-arm64:
    name: Android arm64 decoder lab
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply project patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Write fixed Android signing key
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$SIGN_KEYSTORE_BASE64" || { echo "Missing SIGN_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          {
            echo storeFile='key.jks'
            echo storePassword="$KEYSTORE_PASSWORD"
            echo keyAlias="$KEY_ALIAS"
            echo keyPassword="$KEY_PASSWORD"
          } > android/key.properties

      - name: Set version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Build signed arm64 APK
        run: >-
          flutter build apk --release
          --target-platform android-arm64
          --dart-define-from-file=pili_release.json
          --no-pub

      - name: Prepare artifact
        run: mv build/app/outputs/flutter-apk/app-release.apk PiliBro_decoder_lab_arm64.apk

      - name: Upload Android decoder lab
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Android-arm64-decoder-lab
          path: PiliBro_decoder_lab_arm64.apk
